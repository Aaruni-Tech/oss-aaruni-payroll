<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="dawnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE5F01" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="506" height="506" rx="107" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Cloud Ambient Glow -->
  <path d="M 140 370 C 80 370 30 320 30 260 C 30 205 68 160 120 152 C 145 125 180 110 220 110 C 278 110 324 142 344 190 C 362 182 382 178 402 178 C 452 178 492 218 492 268 C 492 320 452 362 402 362 Z" fill="url(#dawnGrad)" opacity="0.22" filter="url(#glow)" />

  <!-- Outer Cloud Contour -->
  <path d="M 130 350 C 85 350 45 310 45 260 C 45 215 76 178 120 170 C 140 144 172 130 210 130 C 265 130 310 160 325 210 C 340 202 358 198 376 198 C 420 198 456 234 456 278 C 456 324 420 350 376 350 Z" fill="#090D16" stroke="url(#dawnGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Stylized Aaruni 'A' Apex -->
  <path d="M 210 165 L 290 320 L 244 320 L 226 280 L 194 280 L 176 320 L 130 320 Z" fill="url(#dawnGrad)" />
  <polygon points="210,205 184,258 236,258" fill="#090D16" />
  <circle cx="210" cy="170" r="8" fill="#ffffff" />

  <!-- Bottom Subtitle -->
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1px">
    AARUNI <tspan fill="url(#dawnGrad)">CLOUD</tspan>
  </text>
  <text x="256" y="465" font-family="monospace" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="4px">
    ATC &bull; PLATFORM
  </text>
</svg>