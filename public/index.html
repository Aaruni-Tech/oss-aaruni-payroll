:root,

  --at-surface-hover: #293548;
  --at-text: #f8fafc;
  --at-text-secondary: #cbd5e1;
  --at-text-muted: #94a3b8;
  --at-border: #1e293b;
  --at-border-strong: #fe5f01;
  --at-primary: #fe5f01;
  --at-primary-hover: #ea580c;
  --at-primary-fg: #ffffff;
  --at-badge-bg: rgba(254, 95, 1, 0.15);
  --at-badge-fg: #ff8533;
  --at-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 20px rgba(254, 95, 1, 0.12);
  color-scheme: dark;
}

[data-theme="light"] {
  --at-bg: #f8fafc;
  --at-surface: #ffffff;
  --at-surface-subtle: #f1f5f9;
  --at-surface-muted: #e2e8f0;
  --at-surface-hover: #cbd5e1;
  --at-text: #0f172a;
  --at-text-secondary: #334155;
  --at-text-muted: #64748b;
  --at-border: #e2e8f0;
  --at-border-strong: #fe5f01;
  --at-primary: #fe5f01;
  --at-primary-hover: #ea580c;
  --at-primary-fg: #ffffff;
  --at-badge-bg: #fff7ed;
  --at-badge-fg: #c2410c;
  --at-shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 14px rgba(254, 95, 1, 0.08);
  color-scheme: light;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Geist', 'Segoe UI', Roboto, sans-serif;
  background-color: var(--at-bg) !important;
  color: var(--at-text) !important;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  transition: background-color 0.15s ease, color 0.15s ease;
}

/* Glass & Solid Enterprise Cards */
.glass-card {
  background-color: var(--at-surface) !important;
  border: 1px solid var(--at-border) !important;
  box-shadow: var(--at-shadow) !important;
  color: var(--at-text) !important;
  backdrop-filter: none !important;
  border-radius: 16px;
  padding: 16px;
}

/* Signature Aaruni Dawn Orange Primary Buttons & Elements */
.brand-grad,
[data-theme="light"] .brand-grad,
[data-theme="dark"] .brand-grad {
  background: linear-gradient(135deg, #fe5f01 0%, #ea580c 100%) !important;
  color: #ffffff !important;
  border: 1px solid #ea580c !important;
  font-weight: 700;
  box-shadow: 0 2px 10px rgba(254, 95, 1, 0.32) !important;
  transition: all 0.15s ease;
}

.brand-grad *,
[data-theme="light"] .brand-grad *,
[data-theme="dark"] .brand-grad * {
  color: #ffffff !important;
}

.brand-grad:hover {
  opacity: 0.95;
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(254, 95, 1, 0.45) !important;
}

/* Theme Segmented Switcher */
.at-theme-switcher {
  display: inline-flex;
  align-items: center;
  background-color: var(--at-surface-muted);
  border: 1px solid var(--at-border);
  border-radius: 10px;
  padding: 2px;
  gap: 2px;
}

.at-theme-btn {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--at-text-muted);
  cursor: pointer;
  transition: all 0.15s ease;
}

.at-theme-btn.active {
  background: linear-gradient(135deg, #fe5f01 0%, #ea580c 100%);
  color: #ffffff !important;
  box-shadow: 0 2px 6px rgba(254, 95, 1, 0.3);
}

/* ========================================================================= */
/* LIGHT THEME OVERRIDES (CRISP EXECUTIVE LIGHT SURFACES — ZERO MUDDY BOXES) */
/* ========================================================================= */

[data-theme="light"] header {
  background-color: rgba(255, 255, 255, 0.95) !important;
  border-color: #e2e8f0 !important;
}

[data-theme="light"] header .text-white {
  color: #0f172a !important;
}

[data-theme="light"] nav#bottomNav {
  background-color: rgba(255, 255, 255, 0.98) !important;
  border-color: #e2e8f0 !important;
  box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05);
}

/* Scoped card typography in light mode */
[data-theme="light"] .glass-card .text-white:not(.brand-grad *):not(.badge-white) {
  color: #0f172a !important;
}

[data-theme="light"] .glass-card .text-slate-200 {
  color: #1e293b !important;
}

[data-theme="light"] .glass-card .text-slate-300 {
  color: #334155 !important;
}

[data-theme="light"] .glass-card .text-slate-400 {
  color: #64748b !important;
}

[data-theme="light"] .glass-card .border-slate-800,
[data-theme="light"] .glass-card .border-slate-700 {
  border-color: #e2e8f0 !important;
}

/* Transform dark nested metric containers to crisp light surfaces */
[data-theme="light"] .bg-slate-900,
[data-theme="light"] .bg-slate-900\/80,
[data-theme="light"] .bg-slate-900\/90,
[data-theme="light"] .bg-slate-950,
[data-theme="light"] .bg-slate-950\/80 {
  background-color: #f8fafc !important;
  border-color: #e2e8f0 !important;
  color: #0f172a !important;
}

[data-theme="light"] .bg-slate-800,
[data-theme="light"] .bg-slate-800\/60,
[data-theme="light"] .bg-slate-800\/80 {
  background-color: #f1f5f9 !important;
  border-color: #cbd5e1 !important;
  color: #0f172a !important;
}

/* Light mode overrides for form inputs */
[data-theme="light"] input,
[data-theme="light"] select,
[data-theme="light"] textarea {
  background-color: #ffffff !important;
  color: #0f172a !important;
  border-color: #cbd5e1 !important;
}

/* Light mode tables */
[data-theme="light"] table {
  color: #0f172a !important;
}

[data-theme="light"] th {
  color: #475569 !important;
  background-color: #f1f5f9 !important;
  border-color: #e2e8f0 !important;
}

[data-theme="light"] td {
  border-color: #f1f5f9 !important;
}

/* ========================================================================= */

    function applyAaruniTheme() {
      const mode = state.themeMode || "light";
      let resolved = mode;
      if (mode === "auto") {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        resolved = prefersDark ? "dark" : "light";
      }
      if (document.documentElement) {
        document.documentElement.setAttribute("data-theme", resolved);
      }
      ["Light", "Dark", "Auto"].forEach(k => {
        const btn = document.getElementById("themeBtn" + k);
        if (btn) {
          btn.classList.toggle("active", mode.toLowerCase() === k.toLowerCase());
        }
      });
    }

    function setAaruniTheme(mode) {
      state.themeMode = mode;
      safeLocalSet("aaruni_theme_v8", mode);
      applyAaruniTheme();
    }

    if (window.matchMedia) {
      try {

          if (state.themeMode === "auto") applyAaruniTheme();
        });
      } catch (e) {}
    }

      return `<span class="font-mono font-bold">${revealed ? raw : masked}</span> <button onclick="toggleAccountNo('${emp.id}')" class="underline text-xs font-semibold ml-1 cursor-pointer">${revealed ? 'Hide A/C No' : 'Show A/C No'}</button>`;
    }

    function numberToIndianWords(amount) {
      const num = Math.round(Number(amount || 0));
      if (num <= 0) return "Indian Rupee Zero Only";
      const ones = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
      const tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
      function two(n) { return n < 20 ? ones[n] : tens[Math.floor(n/10)] + (n%10 ? " " + ones[n%10] : ""); }
      function conv(n) {
        let s = "";
        if (n >= 10000000) { s += conv(Math.floor(n/10000000)) + " Crore "; n %= 10000000; }
        if (n >= 100000) { s += two(Math.floor(n/100000)) + " Lakh "; n %= 100000; }
        if (n >= 1000) { s += two(Math.floor(n/1000)) + " Thousand "; n %= 1000; }
        if (n >= 100) { s += ones[Math.floor(n/100)] + " Hundred "; n %= 100; }
        if (n > 0) s += two(n);
        return s.trim();
      }
      return "Indian Rupee " + conv(num) + " Only";
    }

    function calcHoursBetween(inTime, outTime) {
      if (!inTime || !outTime) return 0;
      const [h1, m1] = inTime.split(":").map(Number);
      const [h2, m2] = outTime.split(":").map(Number);
      let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
      if (mins < 0) mins += 1440;
      return Math.round((mins / 60) * 100) / 100;
    }

    function computeEmployeePayroll(emp, ym = "2026-11") {
      const [y, m] = ym.split("-").map(Number);
      const calendarDays = new Date(y, m, 0).getDate();
      const limitDay = ym === "2026-11" ? 9 : calendarDays;
      const shift = Number(emp.shiftHours || 8);
      const ctc = Number(emp.monthlyCtc || 0);
      const dailyRate = calendarDays > 0 ? ctc / calendarDays : 0;

      const empEntries = state.timesheets.filter(t => t.empId === emp.id && t.date.startsWith(ym));
      const mapByDate = new Map();
      empEntries.forEach(e => mapByDate.set(e.date, e));

      let paidSundays = 0;
      let workedDays = 0;
      let regularHours = 0;
      let sundayExtraHours = 0;
      let shortHours = 0;
      let absentDays = 0;

      for (let d = 1; d <= limitDay; d++) {
        const dStr = `${ym}-${String(d).padStart(2, "0")}`;
        const dayOfWeek = new Date(y, m - 1, d).getDay();
        const entry = mapByDate.get(dStr);
        const hrs = entry ? Number(entry.hours || 0) : 0;

        if (dayOfWeek === 0) {
          paidSundays++;
          if (hrs > 0) {
            sundayExtraHours += hrs;
            workedDays++;
          }
        } else {
          if (hrs > 0) {
            workedDays++;
            regularHours += hrs;
            if (hrs < shift) shortHours += (shift - hrs);
          } else {
            absentDays++;
          }
        }
      }

      const useCompOff = state.compOffApproved[emp.id] !== false;
      const offsetHrs = useCompOff ? Math.min(sundayExtraHours, shortHours + absentDays * shift) : 0;
      const totalShortfallHrs = Math.max(0, (shortHours + absentDays * shift) - offsetHrs);
      const lopDays = Math.round((totalShortfallHrs / shift) * 100) / 100;

      const accruedPayableDays = Math.max(0, limitDay - lopDays);
      const accruedSalarySoFar = Math.round(dailyRate * accruedPayableDays);

      const fullMonthPayableDays = Math.max(0, calendarDays - lopDays);
      const grossEarned = Math.round(dailyRate * fullMonthPayableDays);
      const basic = Math.round(grossEarned * 0.5);
      const allowance = grossEarned - basic;

      const pendingLoans = state.loans.filter(l => l.empId === emp.id && (l.status === "Pending" || l.status === "Active") && Number(l.remainingBalance || 0) > 0);
      const loanCut = pendingLoans.reduce((sum, l) => sum + Math.min(Number(l.monthlyDeduction || 0), Number(l.remainingBalance || 0)), 0);
      const netPay = Math.max(0, grossEarned - loanCut);

      const submittedToday = mapByDate.has("2026-11-09");

      return {
        emp,
        ym,
        calendarDays,
        limitDay,
        workedDays,
        paidSundays,
        regularHours,
        sundayExtraHours,
        totalHours: regularHours + sundayExtraHours,
        shortHours,
        absentDays,
        offsetHrs,
        lopDays,
        accruedPayableDays,
        totalPayableDays: accruedPayableDays,
        effectiveDaysFromHours: Math.round(((regularHours + sundayExtraHours) / shift) * 10) / 10,
        accruedSalarySoFar,
        fullMonthPayableDays,
        grossEarned,
        basic,
        allowance,
        loanCut,
        netPay,
        submittedToday,
        entries: empEntries.sort((a, b) => b.date.localeCompare(a.date))
      };
    }

    function submitStaffTimesheet(empId, customDate, customIn, customOut, customSummary) {
      const emp = state.employees.find(e => e.id === empId);
      const dtEl = document.getElementById("tsDate");
      const inEl = document.getElementById("tsIn") || document.getElementById("tsEntry");
      const outEl = document.getElementById("tsOut") || document.getElementById("tsExit");
      const sumEl = document.getElementById("tsSummary");
      const linkEl = document.getElementById("tsLink");

      const dt = customDate || (dtEl ? dtEl.value : "2026-11-11");
      const inT = customIn || (inEl ? inEl.value : "10:00");
      const outT = customOut || (outEl ? outEl.value : "19:00");
      const summary = (customSummary || (sumEl ? sumEl.value.trim() : "")) || "Engineering, video production & daily operations tasks";
      const link = (linkEl ? linkEl.value.trim() : "") || "Direct Timesheet";
      const hrs = calcHoursBetween(inT, outT);

      state.timesheets = state.timesheets.filter(t => !(t.empId === empId && t.date === dt));
      state.timesheets.unshift({
        id: `PWA-${empId}-${dt}`,
        empId,
        date: dt,
        entryTime: inT,
        exitTime: outT,
        hours: hrs,
        status: "Worked",
        summary,
        taskLink: link,
        source: "Staff Portal Entry"
      });
      saveState();
      showToast("✅ Timesheet Recorded!", `${emp.name}: ${hrs} hrs (${inT} → ${outT}) logged for ${dt}.`);
      closeModal();
      renderApp();
    }

    function updateWizardCtcPreview() {

      const bEl = document.getElementById("wizBasicPreview");
      const fEl = document.getElementById("wizFixedPreview");
      if (bEl) bEl.textContent = `₹${basic.toLocaleString("en-IN")}/mo (₹${(basic * 12).toLocaleString("en-IN")}/yr)`;

      const nextNum = state.employees.length + 1;

        return;
      }
      const zohoId = String(nextNum).padStart(3, "0");
      const first = name.split(/\s+/)[0].replace(/[^a-zA-Z0-9]/g, "") || "Staff";
      const password = (document.getElementById("wizPassword")?.value || `${first}@${zohoId}`).trim();
      const role = (document.getElementById("wizRole")?.value || "Technical Associate").trim();
      const department = document.getElementById("wizDept")?.value || "Engineering & Technology";
      const joiningDate = (document.getElementById("wizDoj")?.value || "09/11/2026").trim();
      const email = (document.getElementById("wizEmail")?.value || `${name.toLowerCase().replace(/\s+/g, ".")}@fullstackmaster.net`).trim();

      const fatherRaw = (document.getElementById("wizFather")?.value || "-").trim();
      const address = (document.getElementById("wizAddress")?.value || "Beeramguda, Telangana - 502319").trim();
      const monthlyCtc = Number(document.getElementById("wizCtc")?.value || 10000);
      const bankName = (document.getElementById("wizBank")?.value || "Pending").trim();
      const bankAccount = (document.getElementById("wizAcct")?.value || "Pending").trim();
      const ifsc = (document.getElementById("wizIfsc")?.value || "Pending").trim();
      const genOffer = document.getElementById("wizGenOffer")?.checked !== false;
      const sendEmail = document.getElementById("wizSendEmail")?.checked !== false;

      const newEmp = {
        id,
        zohoId,
        name,
        password,
        role,
        designationSub: role,
        department,
        workLocation: "Head Office",
        gender: "-",
        portalAccess: true,
        status: "Active",
        trackTimesheet: monthlyCtc > 0,
        shiftHours: 8,
        monthlyCtc,
        annualCtc: monthlyCtc * 12,
        joiningDate,
        dob: fatherRaw,
        fatherName: fatherRaw,
        pan: "-",
        aadhaar: "Verified on File",
        mobile,
        email,
        alternateEmails: [email],
        address,
        paymentMode: "Manual Bank Transfer",
        bankName,
        accountHolder: name,
        bankAccount,
        ifsc,
        accountType: "Savings",
        upiId: "",
        idCardFile: `${id}_${name.replace(/\s+/g, "_")}_ID_Card.png`
      };

      state.employees.push(newEmp);

      if (sendEmail) {
        const sender = state.emailSender || "hr@fullstackmaster.net";
        state.emailLogs = state.emailLogs || [];
        state.emailLogs.unshift({
          id: "EML-" + Date.now(),
          from: sender,
          to: email,
          subject: `[Aaruni Tech HR] Welcome to Aaruni Tech — Portal Access (${id})`,
          body: `Welcome ${name}! Sign in to the Aaruni Tech Portal using Employee ID ${id} (or ${zohoId}) and your password (${password}).`,
          time: "Just now"
        });
      }

      saveState();
      renderApp();

      if (genOffer) {
        openHRDocByType(id, "OFFER");
        showToast(`${name} (${id}) Added`, `Created profile with password ${password} and generated Offer Letter.`);
      } else {
        closeDocModal();
        showToast(`${name} (${id}) Added`, `Added to roster with password ${password}.`);
      }

    function submitNewLoanAdvance() {
      const empId = document.getElementById("newLoanEmpId")?.value || "AAR-0004";
      const emp = state.employees.find(e => e.id === empId);
      if (!emp) return;
      const amt = Number(document.getElementById("newLoanAmount")?.value || 0);
      const cut = Number(document.getElementById("newLoanCut")?.value || amt);
      const dtRaw = document.getElementById("newLoanDate")?.value || "2026-11-09";
      const status = document.getElementById("newLoanStatus")?.value || "Pending";
      const note = (document.getElementById("newLoanNote")?.value || "").trim() || `Personal advance recorded on ${dtRaw}`;
      if (amt <= 0) {
        showToast("Enter Valid Amount", "Please enter an amount greater than ₹0.");
        return;
      }
      const [y, m, d] = dtRaw.split("-");
      const formattedDate = d && m && y ? `${d}/${m}/${y}` : dtRaw;
      const isPaid = status === "Paid";

      state.loans.unshift({
        id: "LOAN-" + Date.now(),
        empId: emp.id,
        empName: emp.name,
        type: "Personal Advance",
        takenDate: formattedDate,
        totalAmount: amt,
        monthlyDeduction: cut > 0 ? cut : amt,
        remainingBalance: isPaid ? 0 : amt,
        startMonth: `${y || '2026'}-${m || '11'}`,
        paidDate: isPaid ? formattedDate : "-",
        note,
        status: isPaid ? "Paid" : "Pending"
      });
      saveState();
      showToast(
        isPaid ? `Paid Advance Recorded (${emp.name})` : `Pending Advance Recorded (${emp.name})`,
        `₹${amt.toLocaleString("en-IN")} (${isPaid ? 'Paid' : 'Pending'})`
      );
      renderApp();
    }

    function toggleLoanPaidStatus(loanId) {
      const loan = state.loans.find(l => l.id === loanId);
      if (!loan) return;
      const currentlyPaid = loan.status === "Paid" || Number(loan.remainingBalance || 0) === 0;
      if (currentlyPaid) {
        loan.status = "Pending";
        loan.remainingBalance = Number(loan.totalAmount || 5000);
        loan.paidDate = "-";
        showToast("Marked as Pending", `${loan.empName}'s ₹${loan.totalAmount.toLocaleString("en-IN")} advance is now Pending.`);
      } else {
        loan.status = "Paid";
        loan.remainingBalance = 0;
        loan.paidDate = "09/11/2026";
        showToast("Marked as Paid", `${loan.empName}'s ₹${loan.totalAmount.toLocaleString("en-IN")} advance is now Paid.`);
      }
      saveState();
      renderApp();
    }

    function updateLoanField(loanId, field, val) {

      if (!loan) return;
      loan[field] = Number(val || 0);

    }

    function computeCumulativeYTD(empId, upToYearMonth) {
      const targetYm = upToYearMonth || "2026-11";
      // Indian Financial Year starts April (2026-04); if payslip is Jan-Mar 2026, sum 2026-01..2026-03
      const fyStart = targetYm >= "2026-04" ? "2026-04" : "2026-01";
      const relevant = state.payslips.filter(
        p => p.empId === empId && p.yearMonth >= fyStart && p.yearMonth <= targetYm
      );
      if (relevant.length === 0) {
        return null;
      }
      return {
        basicYtd: relevant.reduce((s, p) => s + Number(p.basic || 0), 0),
        fixedYtd: relevant.reduce((s, p) => s + Number(p.fixedAllowance || 0), 0),
        bonusYtd: relevant.reduce((s, p) => s + Number(p.bonus || 0), 0),
        grossYtd: relevant.reduce((s, p) => s + Number(p.grossEarnings || 0), 0),
        dedYtd: relevant.reduce((s, p) => s + Number(p.deductions || 0), 0),
        netYtd: relevant.reduce((s, p) => s + Number(p.netPay || 0), 0),
        monthsCount: relevant.length
      };
    }

    function confirmUPIPaymentCompleted(empId, amount, note) {
      const emp = state.employees.find(e => e.id === empId);
      const utr = "UPI-AXIS-" + Math.floor(100000 + Math.random() * 900000);
      
      // Update any matching pending advance
      if (state.advanceRequests) {
        const adv = state.advanceRequests.find(a => a.empId === empId && a.status === "Pending");
        if (adv) {
          adv.status = "Disbursed";
          adv.disburseDate = new Date().toISOString().slice(0, 10);
          adv.paidUpiRef = utr;
        }
      }

      // Add to notifications
      state.messages = state.messages || [];
      state.messages.unshift({
        id: "NOTIF-" + Date.now(),
        empId: empId,
        title: "🎉 UPI Payout Disbursed",
        body: `Your payment of ₹${Number(amount).toLocaleString('en-IN')} (${note}) was paid via Axis Bank UPI. Ref: ${utr}.`,
        time: "Just now",
        isRead: false
      });
      saveState();
      closeDocModal();
      showToast("✅ Payment Marked as Completed", `UPI payout of ₹${Number(amount).toLocaleString('en-IN')} marked as paid (Ref: ${utr}). Notification sent to ${emp ? emp.name : empId}.`);
      renderApp();
    }

    function submitLeaveRequest(empId) {
      const emp = state.employees.find(e => e.id === empId);
      const type = document.getElementById("leaveTypeInput").value;
      const start = document.getElementById("leaveStartDate").value;
      const end = document.getElementById("leaveEndDate").value;
      const reason = document.getElementById("leaveReasonInput").value.trim() || "Leave Request";
      
      const d1 = new Date(start);
      const d2 = new Date(end);
      const diffDays = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1);

      state.leaveRequests = state.leaveRequests || [];
      const newLeave = {
        id: "LV-" + Date.now().toString().slice(-4),
        empId: emp.id,
        empName: emp.name,
        leaveType: type,
        startDate: start,
        endDate: end,
        days: diffDays,
        reason: reason,
        status: "Pending",
        requestDate: new Date().toISOString().slice(0, 10)
      };
      state.leaveRequests.unshift(newLeave);
      saveState();
      closeDocModal();
      showToast("🏖️ Leave Request Submitted", `Submitted ${diffDays} day(s) ${type} from ${start} to ${end}.`);
      renderApp();
    }

    // ISO/IEC 18004 Single-Block QR Code (Versions 1-5, ECC Level L, Mask 0) -> SVG
    function generateQRCodeSVG(text, pxSize = 200) {
      const bytes = Array.from(new TextEncoder().encode(String(text || "").slice(0, 104)));
      const V_TABLE = [
        null,
        { v: 1, size: 21, dataCw: 19, ecCw: 7, align: [] },
        { v: 2, size: 25, dataCw: 34, ecCw: 10, align: [6, 18] },
        { v: 3, size: 29, dataCw: 55, ecCw: 15, align: [6, 22] },
        { v: 4, size: 33, dataCw: 80, ecCw: 20, align: [6, 26] },
        { v: 5, size: 37, dataCw: 108, ecCw: 26, align: [6, 30] }
      ];
      let cfg = V_TABLE[5];
      for (let v = 1; v <= 5; v++) {
        if (bytes.length + 2 <= V_TABLE[v].dataCw) { cfg = V_TABLE[v]; break; }
      }
      const bits = [];
      const pushBits = (val, len) => {
        for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1);
      };
      pushBits(0b0100, 4); // Byte mode
      pushBits(bytes.length, 8);
      for (const b of bytes) pushBits(b, 8);
      const maxBits = cfg.dataCw * 8;
      for (let i = 0; i < 4 && bits.length < maxBits; i++) bits.push(0);
      while (bits.length % 8 !== 0) bits.push(0);
      const dataCw = [];
      for (let i = 0; i < bits.length; i += 8) {
        let b = 0;
        for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
        dataCw.push(b);
      }
      const pads = [0xEC, 0x11];
      let pIdx = 0;
      while (dataCw.length < cfg.dataCw) dataCw.push(pads[pIdx++ % 2]);

      // Reed-Solomon GF(256) with primitive polynomial 0x11D
      const exp = new Uint8Array(512);
      const log = new Uint8Array(256);
      let x = 1;
      for (let i = 0; i < 255; i++) {
        exp[i] = x;
        log[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11D;
      }
      for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
      const gfMul = (a, b) => (a === 0 || b === 0) ? 0 : exp[log[a] + log[b]];

      let gen = [1];
      for (let i = 0; i < cfg.ecCw; i++) {
        const next = new Array(gen.length + 1).fill(0);
        for (let j = 0; j < gen.length; j++) {
          next[j] ^= gen[j];
          next[j + 1] ^= gfMul(gen[j], exp[i]);
        }
        gen = next;
      }
      const rem = new Array(cfg.ecCw).fill(0);
      for (const d of dataCw) {
        const factor = d ^ rem.shift();
        rem.push(0);
        for (let j = 0; j < cfg.ecCw; j++) {
          rem[j] ^= gfMul(gen[j + 1], factor);
        }
      }
      const allCw = dataCw.concat(rem);

      const N = cfg.size;
      const mat = Array.from({ length: N }, () => new Array(N).fill(null));
      const rsv = Array.from({ length: N }, () => new Array(N).fill(false));

      const placeFinder = (r0, c0) => {
        for (let dr = -1; dr <= 7; dr++) {
          for (let dc = -1; dc <= 7; dc++) {
            const r = r0 + dr, c = c0 + dc;
            if (r < 0 || r >= N || c < 0 || c >= N) continue;
            const inBox = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6;
            const onBorder = dr === 0 || dr === 6 || dc === 0 || dc === 6;
            const inInner = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
            mat[r][c] = inBox && (onBorder || inInner) ? 1 : 0;
            rsv[r][c] = true;
          }
        }
      };
      placeFinder(0, 0);
      placeFinder(0, N - 7);
      placeFinder(N - 7, 0);

      if (cfg.align.length) {
        const [a0, a1] = cfg.align;
        const coords = [[a0, a0], [a0, a1], [a1, a0], [a1, a1]];
        for (const [cr, cc] of coords) {
          if (rsv[cr][cc]) continue;
          for (let dr = -2; dr <= 2; dr++) {
            for (let dc = -2; dc <= 2; dc++) {
              const onB = Math.abs(dr) === 2 || Math.abs(dc) === 2 || (dr === 0 && dc === 0);
              mat[cr + dr][cc + dc] = onB ? 1 : 0;
              rsv[cr + dr][cc + dc] = true;
            }
          }
        }
      }

      for (let i = 8; i < N - 8; i++) {
        mat[6][i] = mat[i][6] = (i % 2 === 0) ? 1 : 0;
        rsv[6][i] = rsv[i][6] = true;
      }

      for (let i = 0; i < 9; i++) {
        if (i < N) { rsv[8][i] = true; rsv[i][8] = true; }
      }
      for (let i = 0; i < 8; i++) {
        rsv[8][N - 1 - i] = true;
        rsv[N - 1 - i][8] = true;
      }
      mat[N - 8][8] = 1;
      rsv[N - 8][8] = true;

      const cwBits = [];
      for (const cw of allCw) {
        for (let b = 7; b >= 0; b--) cwBits.push((cw >> b) & 1);
      }

      let bitIdx = 0;
      let up = true;
      for (let col = N - 1; col > 0; col -= 2) {
        if (col === 6) col--;
        for (let step = 0; step < N; step++) {
          const r = up ? (N - 1 - step) : step;
          for (let dc = 0; dc < 2; dc++) {
            const c = col - dc;
            if (!rsv[r][c]) {
              const bit = bitIdx < cwBits.length ? cwBits[bitIdx++] : 0;
              const mask = ((r + c) % 2 === 0) ? 1 : 0;
              mat[r][c] = bit ^ mask;
            }
          }
        }
        up = !up;
      }

      // Format info for ECC L (01) + Mask 0 (000) -> 0x77c4
      const fmt = 0x77C4;
      const fmtBits = [];
      for (let i = 0; i < 15; i++) fmtBits.push((fmt >> i) & 1); // LSB (bit 0) to MSB (bit 14)
      // Around top-left
      const tlCoords = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
      for (let i = 0; i < 15; i++) {
        const [r, c] = tlCoords[i];
        mat[r][c] = fmtBits[14 - i];
      }
      // Bottom-left & top-right
      for (let i = 0; i < 7; i++) mat[N - 1 - i][8] = fmtBits[14 - i];
      for (let i = 7; i < 15; i++) mat[8][N - 15 + i] = fmtBits[14 - i];

      const quiet = 3;
      const total = N + quiet * 2;
      let rects = "";
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (mat[r][c]) rects += `<rect x="${c + quiet}" y="${r + quiet}" width="1" height="1" fill="#0f172a"/>`;
        }
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${pxSize}" height="${pxSize}" style="border-radius:12px;background:#ffffff;display:block;margin:0 auto;box-shadow:0 4px 14px rgba(0,0,0,0.12);">${rects}</svg>`;
    }

    function checkUrlAutoLogin() {
      try {
        const params = new URLSearchParams(window.location.search);
        const empParam = params.get("emp") || params.get("login");
        const simParam = params.get("sim") || params.get("mobile");
        const tabParam = params.get("tab");
        const themeParam = params.get("theme");
        if (themeParam && ["light", "dark", "auto"].includes(themeParam.toLowerCase())) {
          state.themeMode = themeParam.toLowerCase();
          applyAaruniTheme();
        }
        const isSim = (simParam === "1" || simParam === "true");
        if (!empParam) return;
        const clean = empParam.trim().toUpperCase();
        if (clean === "ADMIN") {
          switchPersona("ADMIN");
        } else {
          const numOnly = parseInt(clean.replace(/[^0-9]/g, ""), 10);
          const found = state.employees.find(e => {
            const eId = e.id.toUpperCase();
            const eNum = parseInt(eId.replace(/[^0-9]/g, ""), 10);
            return eId === clean || 
                   eId.replace("AAR-", "") === clean || 
                   (!isNaN(numOnly) && !isNaN(eNum) && numOnly === eNum) ||
                   (e.zohoId && e.zohoId.toUpperCase() === clean);
          });
          if (found) {
            switchPersona(found.id, true, isSim);
            if (tabParam) state.activeTab = tabParam;
            const badgeParam = params.get("badge");
            if (badgeParam) setTimeout(() => previewIDCard(found.id), 250);
            const payslipParam = params.get("payslip");
            if (payslipParam) setTimeout(() => openOctPayslipForEmp(found.id), 250);
            const holidayParam = params.get("holidays");
            if (holidayParam) setTimeout(() => openHolidayCalendarModal(), 300);
            const taxParam = params.get("tax");
            if (taxParam) setTimeout(() => openACSTaxDossierModal(), 300);
          }
        }
      } catch (e) {}
    }

    function publishCurrentMonthPayroll() {
      state.payrollPublished = true;
      const ym = "2026-11";
      const nowStr = new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" });
      let count = 0;
      state.employees.filter(e => e.status === "Active" && e.trackTimesheet).forEach(emp => {
        count++;
        state.messages.unshift({
          id: "MSG-" + Date.now() + "-" + Math.random().toString(36).substr(2, 4),
          empId: emp.id,
          title: "🎉 Salary for November 2026 Published!",
          body: `Hi ${emp.name}, your November 2026 salary has been calculated and officially published. You can view your updated payslip and bank payment record.`,
          date: nowStr,
          read: false
        });
      });
      saveState();
      showToast("Payroll Published", `November 2026 payroll published and notifications delivered to ${count} active staff members.`);
      renderApp();
    }

      return `

                    🖥️ Desktop View
                  </button>
                  <button onclick="toggleMobileSimulator(true)" class="text-xs px-3 py-1 rounded-lg font-bold brand-grad text-white shadow transition-all cursor-pointer">
                    📱 Mobile App (390px)
                  </button>
                </div>
                <button onclick="switchPersona('ADMIN', false)" class="brand-grad text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow cursor-pointer hover:opacity-90">
                  ← Exit to Admin Console
                </button>
              </div>
            </div>
          ` : ''}

          <!-- Realistic Smartphone Chassis -->

                    const isActive = state.activeTab === t.id;
                    return `

function renderApp() {
      try {
        renderHeaderSession();
        renderRoleBar();
        const roleBar = document.getElementById("authenticatedRoleBar");
        const bottomNav = document.getElementById("bottomNav");
        if (state.persona === "LOGIN") {
          if (roleBar) roleBar.classList.add("hidden");
          if (bottomNav) bottomNav.classList.add("hidden");
        } else {
          if (roleBar) roleBar.classList.add("hidden");
          renderBottomNav();
        }

        const vp = document.getElementById("appViewport");
        if (!vp) return;
        if (state.persona === "LOGIN") {
          vp.innerHTML = renderLoginScreen();
        } else if (state.persona === "ADMIN") {
          vp.innerHTML = renderAdminCockpit();
        } else {
          const emp = state.employees.find(e => e.id === state.persona) || state.employees[3];
          if (state.mobileSimulatorMode) {
            vp.innerHTML = renderMobilePhoneFrame(emp, renderStaffPortal(emp, true));
          } else {
            vp.innerHTML = renderStaffPortal(emp, false);
          }
        }
      } catch (err) {
        console.error("Render error:", err);
      }
    }

    applyAaruniTheme();
    checkUrlAutoLogin();
    renderApp();
  </script>
