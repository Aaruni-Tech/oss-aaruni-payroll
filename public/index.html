    function numberToIndianWords(amount) {
      const num = Math.round(Number(amount || 0));
      if (num <= 0) return "Indian Rupee Zero Only";
      const ones = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
      const tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
      function two(n) { return n < 20 ? ones[n] : tens[Math.floor(n/10)] + (n%10 ? " " + ones[n%10] : ""); }
      function conv(n) {
        let s = "";
        if (n >= 10000000) { s += conv(Math.floor(n/10000000)) + " Crore "; n %= 10000000; }
        if (n >= 100000) { s += two(Math.floor(n/100000)) + " Lakh "; n %= 100000; }
        if (n >= 1000) { s += two(Math.floor(n/1000)) + " Thousand "; n %= 1000; }
        if (n >= 100) { s += ones[Math.floor(n/100)] + " Hundred "; n %= 100; }
        if (n > 0) s += two(n);
        return s.trim();
      }
      return "Indian Rupee " + conv(num) + " Only";
    }

    function calcHoursBetween(inTime, outTime) {
      if (!inTime || !outTime) return 0;
      const [h1, m1] = inTime.split(":").map(Number);
      const [h2, m2] = outTime.split(":").map(Number);
      let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
      if (mins < 0) mins += 1440;
      return Math.round((mins / 60) * 100) / 100;
    }

    function computeEmployeePayroll(emp, ym = "2026-11") {
      const [y, m] = ym.split("-").map(Number);
      const calendarDays = new Date(y, m, 0).getDate();
      const limitDay = ym === "2026-11" ? 9 : calendarDays;
      const shift = Number(emp.shiftHours || 8);
      const ctc = Number(emp.monthlyCtc || 0);
      const dailyRate = calendarDays > 0 ? ctc / calendarDays : 0;

      const empEntries = state.timesheets.filter(t => t.empId === emp.id && t.date.startsWith(ym));
      const mapByDate = new Map();
      empEntries.forEach(e => mapByDate.set(e.date, e));

      let paidSundays = 0;
      let workedDays = 0;
      let regularHours = 0;
      let sundayExtraHours = 0;
      let shortHours = 0;
      let absentDays = 0;

      for (let d = 1; d <= limitDay; d++) {
        const dStr = `${ym}-${String(d).padStart(2, "0")}`;
        const dayOfWeek = new Date(y, m - 1, d).getDay();
        const entry = mapByDate.get(dStr);
        const hrs = entry ? Number(entry.hours || 0) : 0;

        if (dayOfWeek === 0) {
          paidSundays++;
          if (hrs > 0) {
            sundayExtraHours += hrs;
            workedDays++;
          }
        } else {
          if (hrs > 0) {
            workedDays++;
            regularHours += hrs;
            if (hrs < shift) shortHours += (shift - hrs);
          } else {
            absentDays++;
          }
        }
      }

      const useCompOff = state.compOffApproved[emp.id] !== false;
      const offsetHrs = useCompOff ? Math.min(sundayExtraHours, shortHours + absentDays * shift) : 0;
      const totalShortfallHrs = Math.max(0, (shortHours + absentDays * shift) - offsetHrs);
      const lopDays = Math.round((totalShortfallHrs / shift) * 100) / 100;

      const accruedPayableDays = Math.max(0, limitDay - lopDays);
      const accruedSalarySoFar = Math.round(dailyRate * accruedPayableDays);

      const fullMonthPayableDays = Math.max(0, calendarDays - lopDays);
      const grossEarned = Math.round(dailyRate * fullMonthPayableDays);
      const basic = Math.round(grossEarned * 0.5);
      const allowance = grossEarned - basic;

      const activeLoan = state.loans.find(l => l.empId === emp.id && l.status === "Active" && l.remainingBalance > 0);
      const loanCut = activeLoan ? Math.min(activeLoan.monthlyDeduction, activeLoan.remainingBalance) : 0;
      const netPay = Math.max(0, grossEarned - loanCut);

      const submittedToday = mapByDate.has("2026-11-09");

      return {
        emp,
        ym,
        calendarDays,
        limitDay,
        workedDays,
        paidSundays,
        regularHours,
        sundayExtraHours,
        totalHours: regularHours + sundayExtraHours,
        shortHours,
        absentDays,
        offsetHrs,
        lopDays,
        accruedPayableDays,
        accruedSalarySoFar,
        fullMonthPayableDays,
        grossEarned,
        basic,
        allowance,
        loanCut,
        netPay,
        submittedToday,
        entries: empEntries.sort((a, b) => b.date.localeCompare(a.date))
      };
    }

    function updateCalculatedHoursPreview() {
      const inT = document.getElementById("tsIn")?.value;
      const outT = document.getElementById("tsOut")?.value;
      const hrs = calcHoursBetween(inT, outT);
      const units = Math.min(1, Math.round((hrs / 8) * 100) / 100);
      const el = document.getElementById("tsCalcBadge");
      if (el) el.textContent = `${hrs.toFixed(2)} hrs (${units} Day Unit)`;
    }

    function submitStaffTimesheet(empId) {
      const emp = state.employees.find(e => e.id === empId);
      const dt = document.getElementById("tsDate").value;
      const inT = document.getElementById("tsIn").value;
      const outT = document.getElementById("tsOut").value;
      const summary = document.getElementById("tsSummary").value.trim() || "Daily engineering & content tasks";
      const link = document.getElementById("tsLink").value.trim() || "Mobile PWA";
      const hrs = calcHoursBetween(inT, outT);

      state.timesheets = state.timesheets.filter(t => !(t.empId === empId && t.date === dt));
      state.timesheets.unshift({
        id: `PWA-${empId}-${dt}`,
        empId,
        date: dt,
        entryTime: inT,
        exitTime: outT,
        hours: hrs,
        status: "Worked",
        summary,
        taskLink: link,
        source: "Mobile PWA (Entry/Exit)"
      });
      saveState();
      showToast("✅ Timesheet Logged & Synced!", `${emp.name}: ${hrs} hrs (${inT} → ${outT}) recorded for ${dt}. Evening 6–9 PM reminders stopped for today.`);
      renderApp();
    }

    // ISO/IEC 18004 Single-Block QR Code (Versions 1-5, ECC Level L, Mask 0) -> SVG
    function generateQRCodeSVG(text, pxSize = 200) {
      const bytes = Array.from(new TextEncoder().encode(String(text || "").slice(0, 104)));
      const V_TABLE = [
        null,
        { v: 1, size: 21, dataCw: 19, ecCw: 7, align: [] },
        { v: 2, size: 25, dataCw: 34, ecCw: 10, align: [6, 18] },
        { v: 3, size: 29, dataCw: 55, ecCw: 15, align: [6, 22] },
        { v: 4, size: 33, dataCw: 80, ecCw: 20, align: [6, 26] },
        { v: 5, size: 37, dataCw: 108, ecCw: 26, align: [6, 30] }
      ];
      let cfg = V_TABLE[5];
      for (let v = 1; v <= 5; v++) {
        if (bytes.length + 2 <= V_TABLE[v].dataCw) { cfg = V_TABLE[v]; break; }
      }
      const bits = [];
      const pushBits = (val, len) => {
        for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1);
      };
      pushBits(0b0100, 4); // Byte mode
      pushBits(bytes.length, 8);
      for (const b of bytes) pushBits(b, 8);
      const maxBits = cfg.dataCw * 8;
      for (let i = 0; i < 4 && bits.length < maxBits; i++) bits.push(0);
      while (bits.length % 8 !== 0) bits.push(0);
      const dataCw = [];
      for (let i = 0; i < bits.length; i += 8) {
        let b = 0;
        for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
        dataCw.push(b);
      }
      const pads = [0xEC, 0x11];
      let pIdx = 0;
      while (dataCw.length < cfg.dataCw) dataCw.push(pads[pIdx++ % 2]);

      // Reed-Solomon GF(256) with primitive polynomial 0x11D
      const exp = new Uint8Array(512);
      const log = new Uint8Array(256);
      let x = 1;
      for (let i = 0; i < 255; i++) {
        exp[i] = x;
        log[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11D;
      }
      for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
      const gfMul = (a, b) => (a === 0 || b === 0) ? 0 : exp[log[a] + log[b]];

      let gen = [1];
      for (let i = 0; i < cfg.ecCw; i++) {
        const next = new Array(gen.length + 1).fill(0);
        for (let j = 0; j < gen.length; j++) {
          next[j] ^= gen[j];
          next[j + 1] ^= gfMul(gen[j], exp[i]);
        }
        gen = next;
      }
      const rem = new Array(cfg.ecCw).fill(0);
      for (const d of dataCw) {
        const factor = d ^ rem.shift();
        rem.push(0);
        for (let j = 0; j < cfg.ecCw; j++) {
          rem[j] ^= gfMul(gen[j + 1], factor);
        }
      }
      const allCw = dataCw.concat(rem);

      const N = cfg.size;
      const mat = Array.from({ length: N }, () => new Array(N).fill(null));
      const rsv = Array.from({ length: N }, () => new Array(N).fill(false));

      const placeFinder = (r0, c0) => {
        for (let dr = -1; dr <= 7; dr++) {
          for (let dc = -1; dc <= 7; dc++) {
            const r = r0 + dr, c = c0 + dc;
            if (r < 0 || r >= N || c < 0 || c >= N) continue;
            const inBox = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6;
            const onBorder = dr === 0 || dr === 6 || dc === 0 || dc === 6;
            const inInner = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
            mat[r][c] = inBox && (onBorder || inInner) ? 1 : 0;
            rsv[r][c] = true;
          }
        }
      };
      placeFinder(0, 0);
      placeFinder(0, N - 7);
      placeFinder(N - 7, 0);

      if (cfg.align.length) {
        const [a0, a1] = cfg.align;
        const coords = [[a0, a0], [a0, a1], [a1, a0], [a1, a1]];
        for (const [cr, cc] of coords) {
          if (rsv[cr][cc]) continue;
          for (let dr = -2; dr <= 2; dr++) {
            for (let dc = -2; dc <= 2; dc++) {
              const onB = Math.abs(dr) === 2 || Math.abs(dc) === 2 || (dr === 0 && dc === 0);
              mat[cr + dr][cc + dc] = onB ? 1 : 0;
              rsv[cr + dr][cc + dc] = true;
            }
          }
        }
      }

      for (let i = 8; i < N - 8; i++) {
        mat[6][i] = mat[i][6] = (i % 2 === 0) ? 1 : 0;
        rsv[6][i] = rsv[i][6] = true;
      }

      for (let i = 0; i < 9; i++) {
        if (i < N) { rsv[8][i] = true; rsv[i][8] = true; }
      }
      for (let i = 0; i < 8; i++) {
        rsv[8][N - 1 - i] = true;
        rsv[N - 1 - i][8] = true;
      }
      mat[N - 8][8] = 1;
      rsv[N - 8][8] = true;

      const cwBits = [];
      for (const cw of allCw) {
        for (let b = 7; b >= 0; b--) cwBits.push((cw >> b) & 1);
      }

      let bitIdx = 0;
      let up = true;
      for (let col = N - 1; col > 0; col -= 2) {
        if (col === 6) col--;
        for (let step = 0; step < N; step++) {
          const r = up ? (N - 1 - step) : step;
          for (let dc = 0; dc < 2; dc++) {
            const c = col - dc;
            if (!rsv[r][c]) {
              const bit = bitIdx < cwBits.length ? cwBits[bitIdx++] : 0;
              const mask = ((r + c) % 2 === 0) ? 1 : 0;
              mat[r][c] = bit ^ mask;
            }
          }
        }
        up = !up;
      }

      // Format info for ECC L (01) + Mask 0 (000) -> 0x77c4
      const fmt = 0x77C4;
      const fmtBits = [];
      for (let i = 0; i < 15; i++) fmtBits.push((fmt >> i) & 1); // LSB (bit 0) to MSB (bit 14)
      // Around top-left
      const tlCoords = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
      for (let i = 0; i < 15; i++) {
        const [r, c] = tlCoords[i];
        mat[r][c] = fmtBits[14 - i];
      }
      // Bottom-left & top-right
      for (let i = 0; i < 7; i++) mat[N - 1 - i][8] = fmtBits[14 - i];
      for (let i = 7; i < 15; i++) mat[8][N - 15 + i] = fmtBits[14 - i];

      const quiet = 3;
      const total = N + quiet * 2;
      let rects = "";
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (mat[r][c]) rects += `<rect x="${c + quiet}" y="${r + quiet}" width="1" height="1" fill="#0f172a"/>`;
        }
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${pxSize}" height="${pxSize}" style="border-radius:12px;background:#ffffff;display:block;margin:0 auto;box-shadow:0 4px 14px rgba(0,0,0,0.12);">${rects}</svg>`;
    }
