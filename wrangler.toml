name = "aaruni-tech-payroll"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

# Cloudflare D1 Database Binding (Encrypted HR & Payroll Vault)
[[d1_databases]]
binding = "DB"
database_name = "aaruni_payroll_vault"
database_id = "00000000-0000-0000-0000-000000000000"

# Cloudflare Cron Triggers:
# 1. Every 30 mins between 6:00 PM and 9:00 PM IST (12:30 to 15:30 UTC) Mon-Sat -> Timesheet Push Reminders
# 2. 1st of Every Month at 9:00 AM IST (03:30 UTC) -> Admin Monthly Payroll & UPI Disbursement Reminder
[triggers]
crons = [
  "0,30 12,13,14,15 * * 1-6",
  "30 3 1 * *"
]
