name: Portfolio boundaries
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- public/_worker.js public/cloud.html public/services.html public/service-catalog.json
